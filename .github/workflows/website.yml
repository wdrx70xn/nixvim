name: Documentation
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: docs-website
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  prepare:
    name: Version info
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      versions: ${{ steps.versions.outputs.result }}
    steps:
    - name: Checkout version-info
      uses: actions/checkout@v6
      with:
        sparse-checkout: version-info.toml
        sparse-checkout-cone-mode: false
    - name: Produce build matrix
      id: matrix
      uses: mikefarah/yq@master
      with:
        cmd: "yq --no-colors --output-format=json '\n  [\n    .versions\n    | to_entries\n\
          \    | reverse\n    | .[]\n    | {\n        \"ref\": .value.branch,\n  \
          \      \"name\": .key,\n        \"base-href\": \"/nixvim/\"\n      }\n \
          \   | select(.ref != \"main\").sub-path = .name\n    | select(.ref != \"\
          main\").base-href = \"\\(.base-href)\\(.name)/\"\n  ]\n' version-info.toml\n"
    - name: Produce "other versions" array
      id: versions
      uses: mikefarah/yq@master
      with:
        cmd: "yq --no-colors --output-format=json '\n  [\n    .versions\n    | to_entries\n\
          \    | reverse\n    | .[]\n    | {\n        \"branch\": .value.branch,\n\
          \        \"nixpkgsBranch\": .value.channel,\n        \"baseHref\": \"/nixvim/\\\
          (.key)/\",\n        \"status\": .value.status\n      }\n    | select(.branch\
          \ == \"main\").baseHref = \"/nixvim/\"\n  ]\n' version-info.toml\n"
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
    - name: Install nix
      uses: cachix/install-nix-action@v31
    - name: Configure cachix
      uses: cachix/cachix-action@v17
      with:
        name: nix-community
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ matrix.ref }}
    - name: Build docs
      uses: ./.github/actions/build-docs
      with:
        artifact-name: ${{ matrix.name }}-docs
        sub-path: ${{ matrix.sub-path }}
        base-href: ${{ matrix.base-href }}
        versions: ${{ needs.prepare.outputs.versions }}
  combine:
    name: Combine builds
    runs-on: ubuntu-latest
    needs: build
    env:
      in: artifacts
      out: combined
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        path: ${{ env.in }}
        pattern: '*-docs'
        merge-multiple: false
    - name: Extract archives
      run: "mkdir -p \"$out\"\nfind \"$in\" -name artifact.tar \\\n| parallel tar\
        \ \\\n    --verbose \\\n    --extract \\\n    --file {} \\\n    --directory\
        \ \"$out\"\n"
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ env.out }}
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: combine
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
