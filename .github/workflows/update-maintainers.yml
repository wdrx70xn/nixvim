name: Update maintainers list
'on':
  push:
    branches:
    - main
    paths:
    - lib/maintainers.nix
  schedule:
  - cron: 0 9 * * 1
  workflow_dispatch:
    inputs:
      create_pr:
        description: Create PR even if no changes
        required: false
        default: false
        type: boolean
defaults:
  run:
    shell: bash
jobs:
  update-maintainers:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wdrx70xn' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    env:
      pr_branch: update/maintainers-${{ github.ref_name }}
    steps:
    - name: Create GitHub App token
      uses: actions/create-github-app-token@v3
      if: vars.CI_APP_ID
      id: app-token
      with:
        app-id: ${{ vars.CI_APP_ID }}
        private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - name: Get GitHub App user info
      id: user-info
      if: vars.CI_APP_ID
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        slug: ${{ steps.app-token.outputs.app-slug }}
      run: "name=\"$slug[bot]\"\nid=$(gh api \"/users/$name\" --jq .id)\n{\n  echo\
        \ \"id=$id\"\n  echo \"name=$name\"\n  echo \"email=$id+$name@users.noreply.github.com\"\
        \n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ steps.app-token.outputs.token || github.token }}
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ steps.app-token.outputs.token || github.token }}
        extra_nix_config: 'allow-import-from-derivation = false

          '
    - name: Setup Git
      env:
        name: ${{ steps.user-info.outputs.name || 'github-actions[bot]' }}
        email: ${{ steps.user-info.outputs.email || '41898282+github-actions[bot]@users.noreply.github.com'
          }}
      run: 'git config user.name "$name"

        git config user.email "$email"

        '
    - name: Generate updated maintainers list
      run: "echo \"::group::\U0001F4CB Generating updated generated/all-maintainers.nix...\"\
        \nnix run .#generate-all-maintainers -- --root . --output generated/all-maintainers.nix\n\
        echo \"::endgroup::\"\necho \"::group::\U0001F3A8 Formatting with nixfmt...\"\
        \nnix fmt generated/all-maintainers.nix\necho \"::endgroup::\"\n"
    - name: Check for changes
      id: check-changes
      run: "if git diff --quiet generated/all-maintainers.nix; then\n  echo \"No changes\
        \ to generated/all-maintainers.nix\"\n  echo \"has_changes=false\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo \"Changes detected in generated/all-maintainers.nix\"\n  echo\
        \ \"has_changes=true\" >> \"$GITHUB_OUTPUT\"\n  added=$(git diff --numstat\
        \ generated/all-maintainers.nix | cut -f1)\n  removed=$(git diff --numstat\
        \ generated/all-maintainers.nix | cut -f2)\n  echo \"changes_summary=+$added\
        \ -$removed lines\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Validate generated file
      if: steps.check-changes.outputs.has_changes == 'true'
      run: "echo \"\U0001F50D Validating generated generated/all-maintainers.nix...\"\
        \nif nix-instantiate --eval  generated/all-maintainers.nix --strict > /dev/null;\
        \ then\n  echo \"\u2705 Generated file has valid Nix syntax\"\nelse\n  echo\
        \ \"\u274C Generated file has invalid Nix syntax\"\n  exit 1\nfi\n"
    - name: Create update branch
      run: 'git branch -D "$pr_branch" || echo "Nothing to delete"

        git switch -c "$pr_branch"

        '
    - name: Get info on the current PR
      id: open_pr_info
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: "# Query for info about the already open update PR\ninfo=$(\n  gh api graphql\
        \ -F owner='{owner}' -F repo='{repo}' -F branch=\"$pr_branch\" -f query='\n\
        \    query($owner:String!, $repo:String!, $branch:String!) {\n      repository(owner:\
        \ $owner, name: $repo) {\n        pullRequests(first: 1, states: OPEN, headRefName:\
        \ $branch) {\n          nodes {\n            number\n            url\n   \
        \       }\n        }\n      }\n    }\n  ' | jq --raw-output '\n    .data.repository.pullRequests.nodes[]\n\
        \    | to_entries[]\n    | \"\\(.key)=\\(.value)\"\n  '\n)\nif [[ -n \"$info\"\
        \ ]]; then\n  echo \"PR info:\"\n  echo \"$info\"\n  echo \"$info\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"No PR is currently open\"\nfi\n"
    - name: Fetch current PR's branch
      if: steps.open_pr_info.outputs.number
      run: 'git fetch origin "$pr_branch"

        git branch --set-upstream-to "origin/$pr_branch"

        '
    - name: Create Pull Request
      id: create-pr
      if: steps.check-changes.outputs.has_changes == 'true' || github.event.inputs.create_pr
        == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        title: 'maintainers: update generated/all-maintainers.nix'
        commit_body: 'Automated update of the master maintainers list combining:

          - Nixvim specific maintainers from lib/maintainers.nix

          - Nixpkgs maintainers referenced in Nixvim modules


          Changes: ${{ steps.check-changes.outputs.changes_summary || ''No content
          changes'' }}


          Generated by: flake/dev/generate-all-maintainers/generate-all-maintainers.py

          '
        pr_url: ${{ steps.open_pr_info.outputs.url }}
        pr_num: ${{ steps.open_pr_info.outputs.number }}
        pr_body: "## \U0001F4CB Summary\n\nThis PR updates the master maintainers\
          \ list (`generated/all-maintainers.nix`) which combines:\n- **Nixvim specific\
          \ maintainers** from `lib/maintainers.nix`\n- **Nixpkgs maintainers** referenced\
          \ in Nixvim modules\n\n## \U0001F504 Changes\n\n**Statistics:** ${{ steps.check-changes.outputs.changes_summary\
          \ || 'No content changes (format/comment updates only)' }}\n\nThe updated\
          \ list includes all maintainers needed for review assignments across the\
          \ Nixvim project.\n\n## \U0001F916 Automation\n\n- **Generated by:** `flake/dev/generate-all-maintainers/generate-all-maintainers.py`\n\
          - **Trigger:** ${{ github.event_name == 'schedule' && 'Scheduled weekly\
          \ update' || 'Manual workflow dispatch' }}\n- **Validation:** File syntax\
          \ verified with `nix-instantiate --eval`\n\n## \U0001F4DA Usage\n\nThis\
          \ file can be imported and used for maintainer lookups:\n```nix\nlet allMaintainers\
          \ = import ./generated/all-maintainers.nix; in\n# Access any maintainer\
          \ by name: allMaintainers.username\n```\n\n---\n\U0001F916 *This PR was\
          \ automatically created by the [update-maintainers workflow](${{ github.server_url\
          \ }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*\n"
      run: "git add generated/all-maintainers.nix\ngit commit -m \"$title\" -m \"\
        $commit_body\"\n\necho \"Pushing to remote branch $pr_branch\"\ngit push --force\
        \ --set-upstream origin \"$pr_branch\"\n\nif [ -z \"$pr_num\" ]; then\n  echo\
        \ \"Creating new pull request.\"\n  PR_URL=$(\n    gh pr create \\\n     \
        \ --title \"$title\" \\\n      --body \"$pr_body\"\n  )\nelse\n  PR_URL=$pr_url\n\
        \  echo \"Pull request already exists: $PR_URL\"\n  gh pr edit \"$pr_num\"\
        \ --body \"$pr_body\"\nfi\n\necho \"pr_url=$PR_URL\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Summary
      env:
        has_changes: ${{ steps.check-changes.outputs.has_changes }}
        changes: ${{ steps.check-changes.outputs.changes_summary }}
        pr_url: ${{ steps.create-pr.outputs.pr_url}}
        pr_num: ${{ steps.open_pr_info.outputs.number }}
      run: "if [[ \"$has_changes\" == \"true\" ]]; then\n    if [[ -n \"$pr_num\"\
        \ ]]; then\n      echo \"\u2705 Successfully updated PR with new changes.\"\
        \n      echo \"$changes\"\n      echo \"\U0001F517 PR URL: $pr_url\"\n   \
        \   echo \"### \u2705 PR Updated\" >> $GITHUB_STEP_SUMMARY\n      echo \"\
        [$pr_url]($pr_url)\" >> $GITHUB_STEP_SUMMARY\n    elif [[ -n \"$pr_url\" ]];\
        \ then\n      echo \"\u2705 Successfully created PR with maintainer updates.\"\
        \n      echo \"$changes\"\n      echo \"\U0001F517 PR URL: $pr_url\"\n   \
        \   echo \"### \u2705 PR Created\" >> $GITHUB_STEP_SUMMARY\n      echo \"\
        [$pr_url]($pr_url)\" >> $GITHUB_STEP_SUMMARY\n    else\n      echo \"\u274C\
        \ Failed to create or update pull request.\"\n      echo \"### \u274C PR Operation\
        \ Failed\" >> $GITHUB_STEP_SUMMARY\n      echo \"A pull request was intended\
        \ but the URL was not captured. Please check the logs.\" >> $GITHUB_STEP_SUMMARY\n\
        \    fi\nelse\n  echo \"\u2139\uFE0F No changes detected - maintainers list\
        \ is up to date.\"\n  echo \"### \u2139\uFE0F No Changes\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"The maintainers list is up-to-date. No PR was created.\" >> $GITHUB_STEP_SUMMARY\n\
        fi\n"
